name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group desktop --python 3.12
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - run: uv run --frozen python -m pytest -q
      - run: npm run build
      - run: uv run --frozen python scripts/check_desktop.py
      - name: Package
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" --draft --verify-tag --title "Ask Danta $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --draft --verify-tag --title "Ask Danta $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" installers/* --clobber
