<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Ask Danta · 产品演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#222c39;font-family:'Microsoft YaHei','Segoe UI',sans-serif;overflow:hidden;width:1920px;height:1080px}
.window{position:absolute;left:240px;top:136px;width:1440px;height:800px;background:white;border:1px solid #d8e4ef;border-radius:20px;overflow:hidden;box-shadow:0 24px 70px #24496b16}
.chrome{height:36px;border-bottom:1px solid #edf1f5;display:flex;align-items:center;justify-content:center;background:#fafcfe;color:#8291a2;font-size:13px;position:relative}.dots{position:absolute;left:17px;display:flex;gap:7px}.dots i{display:block;width:7px;height:7px;border-radius:50%;background:#d4dfe9}

.cover{position:absolute;inset:0;background:#edf4fb;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;opacity:1;transition:opacity .55s ease;pointer-events:none}.cover.hidden{opacity:0}
